<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Прогноз налогов</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
  <h1 class="h4 mb-2">Прогноз налогов</h1>
  <p class="text-muted">Доступ по продуктовому коду. Код выдаётся вручную по запросу на почту.</p>
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="card shadow-sm">
    <div class="card-body">
      <label class="form-label">Продуктовый код</label>
      <input class="form-control font-monospace" name="code" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" required>
      <button class="btn btn-primary w-100 mt-3" type="submit">Войти</button>
    </div>
  </form>
  <p class="small text-muted mt-3 mb-0">
    Нет кода? Напишите на
    <a href="mailto:YOUR_EMAIL@example.com">Llomao@yandex.ru</a>
  </p>
</div>
</body>
</html>
